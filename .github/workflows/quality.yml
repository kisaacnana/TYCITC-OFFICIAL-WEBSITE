name: Website Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v0.6.0
        with:
          root: .
          css: true
          format: text

      - name: Check PHP syntax
        run: php -l form-handler.php
